# Project-wide Gradle settings.
# Container reality: 2 GiB cgroup memory cap — keep the build JVM well under it.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# Kotlin compiles in-process (no second daemon JVM) to halve peak memory.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.13 supports compileSdk 36; silence the warning belt-and-braces on older AGP installs.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
